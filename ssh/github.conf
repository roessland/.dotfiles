# Included on line 1 of ~/.ssh/config, so these values win over `Host *`.
# Reuse cuts `git fetch` ~2.4s -> ~0.9s. GitHub allows 10 sessions per connection.
# Risks: any process running as you can use an open connection without a key.
# A connection opened with one key serves other keys (%n separates aliases).
# After a VPN change or sleep, commands can hang ~60s. Now: ssh -O exit git@github.com
Host github.com
  ControlMaster auto
  ControlPath ~/.ssh/cm-%n-%C
  ControlPersist 10m
  # Keeps git on protocol v2 when plain ssh opened the connection.
  SendEnv GIT_PROTOCOL
  ServerAliveInterval 15
  ServerAliveCountMax 3
  ForwardAgent no
